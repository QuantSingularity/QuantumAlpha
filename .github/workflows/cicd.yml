name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # ============================================================
  # Job 1 -- Code Quality Checks (Python & Prettier)
  # ============================================================
  code_quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python formatters
        run: |
          python -m pip install --upgrade pip
          python -m pip install autoflake black==25.11.0

      - name: Check Python Code Quality
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Running autoflake check ==="
          autoflake --remove-all-unused-imports --remove-unused-variables --recursive --check .
          echo "=== Running black check ==="
          black . --check

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Global Formatters
        run: npm install -g prettier prettier-plugin-solidity

      - name: Run Global Prettier Check
        shell: bash
        run: |
          set -euo pipefail
          NODE_GLOBAL=$(npm root -g)
          echo "=== Running Prettier check ==="
          prettier --plugin="$NODE_GLOBAL/prettier-plugin-solidity/dist/index.js" \
            --check "**/*.{js,jsx,ts,tsx,json,html,css,md,sol,yml,yaml}"

      - name: Quality checks complete
        run: echo "All formatting and quality checks passed."

  # ============================================================
  # Job 2 -- Backend Tests (Python / Pytest)
  # ============================================================
  backend_tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: code_quality

    env:
      BACKEND_DIR: code/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: code/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f "${{ env.BACKEND_DIR }}/requirements.txt" ]; then
            python -m pip install -r "${{ env.BACKEND_DIR }}/requirements.txt"
          fi
          python -m pip install pytest pytest-cov pytest-asyncio

      - name: Run backend test suite
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          set -euo pipefail
          pytest tests/ \
            --tb=short \
            --strict-markers \
            -v \
            --cov=. \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: code/backend/coverage.xml
          retention-days: 30

  # ============================================================
  # Job 3 -- Backend Build (Docker images + container smoke tests)
  # ============================================================
  backend_build:
    name: Backend Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: backend_tests

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: code/backend/Dockerfile
            target: runtime
            port: 8000
            expect: '"status":"ok"'
          - name: data-service
            file: code/Dockerfile.service
            target: runtime
            build_args: APP_MODULE=backend.data_service.app:app
            port: 8080
            expect: '"status":"ok"'
          - name: risk-service
            file: code/Dockerfile.service
            target: runtime
            build_args: APP_MODULE=backend.risk_service.app:app
            port: 8080
            expect: '"status":"ok"'
          - name: execution-service
            file: code/Dockerfile.service
            target: runtime
            build_args: APP_MODULE=backend.execution_service.app:app
            port: 8080
            expect: '"status":"ok"'
          - name: ai-engine
            file: code/ai_models/Dockerfile
            build_args: INSTALL_ML=false
            port: 8080
            expect: '"status":"healthy"'

    env:
      IMAGE_NAME: quantumalpha-${{ matrix.name }}
      CONTAINER_NAME: quantumalpha-${{ matrix.name }}-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: code
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build_args }}
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Verify image runs as a non-root user
        run: |
          set -euo pipefail
          uid=$(docker run --rm --entrypoint id "${IMAGE_NAME}:ci" -u)
          echo "Container user id: ${uid}"
          if [ "${uid}" = "0" ]; then
            echo "Image must not run as root." >&2
            exit 1
          fi

      - name: Smoke test the built image
        env:
          PORT: ${{ matrix.port }}
          EXPECT: ${{ matrix.expect }}
        run: |
          set -euo pipefail

          docker run -d \
            --name "${CONTAINER_NAME}" \
            -p "${PORT}:${PORT}" \
            "${IMAGE_NAME}:ci"

          echo "=== Waiting for service to respond ==="
          ready=false
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${PORT}/health" -o response.txt; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            echo "Service did not become ready in time." >&2
            docker logs "${CONTAINER_NAME}"
            exit 1
          fi

          echo "=== Response ==="
          cat response.txt
          echo
          grep -qF "${EXPECT}" <(tr -d ' \n' < response.txt) || {
            echo "Unexpected health response." >&2
            docker logs "${CONTAINER_NAME}"
            exit 1
          }

      - name: Show container logs on failure
        if: failure()
        run: docker logs "${CONTAINER_NAME}" || true

      - name: Stop container
        if: always()
        run: docker rm -f "${CONTAINER_NAME}" || true

  # ============================================================
  # Job 4 -- Web Frontend Build
  # ============================================================
  frontend_build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: web-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web-frontend
        run: CI=false npm run build

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web-frontend/dist/
          retention-days: 7
