name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # ============================================================
  # Job 1 -- Code Quality Checks (Python & Prettier)
  # ============================================================
  code_quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python formatters
        run: |
          python -m pip install --upgrade pip
          python -m pip install autoflake black==25.11.0

      - name: Check Python Code Quality
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Running autoflake check ==="
          autoflake --remove-all-unused-imports --remove-unused-variables --recursive --check .
          echo "=== Running black check ==="
          black . --check

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Global Formatters
        run: npm install -g prettier prettier-plugin-solidity

      - name: Run Global Prettier Check
        shell: bash
        run: |
          set -euo pipefail
          NODE_GLOBAL=$(npm root -g)
          echo "=== Running Prettier check ==="
          prettier --plugin="$NODE_GLOBAL/prettier-plugin-solidity/dist/index.js" \
            --check "**/*.{js,jsx,ts,tsx,json,html,css,md,sol,yml,yaml}"

      - name: Quality checks complete
        run: echo "All formatting and quality checks passed."

  # ======================================================================
  # Job 2 -- Backend Test & Build (Pytest + Docker images + smoke tests)
  # ======================================================================
  backend_test_build:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    env:
      BACKEND_DIR: code/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: code/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f "${{ env.BACKEND_DIR }}/requirements.txt" ]; then
            python -m pip install -r "${{ env.BACKEND_DIR }}/requirements.txt"
          fi
          python -m pip install pytest pytest-cov pytest-asyncio

      - name: Run backend test suite
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          set -euo pipefail
          pytest tests/ \
            --tb=short \
            --strict-markers \
            -v \
            --cov=. \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: code/backend/coverage.xml
          retention-days: 30

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: code
          file: code/backend/Dockerfile
          target: runtime
          push: false
          load: true
          tags: quantumalpha-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build service image (data, risk and execution services)
        uses: docker/build-push-action@v6
        with:
          context: code
          file: code/Dockerfile.service
          target: runtime
          push: false
          load: true
          tags: quantumalpha-service:ci
          cache-from: type=gha,scope=service
          cache-to: type=gha,mode=max,scope=service

      - name: Build AI engine image
        uses: docker/build-push-action@v6
        with:
          context: code
          file: code/ai_models/Dockerfile
          build-args: INSTALL_ML=false
          push: false
          load: true
          tags: quantumalpha-ai-engine:ci
          cache-from: type=gha,scope=ai-engine
          cache-to: type=gha,mode=max,scope=ai-engine

      - name: Verify images run as a non-root user
        run: |
          set -euo pipefail
          for image in quantumalpha-api quantumalpha-service quantumalpha-ai-engine; do
            uid=$(docker run --rm --entrypoint id "${image}:ci" -u)
            echo "${image}: container user id ${uid}"
            if [ "${uid}" = "0" ]; then
              echo "${image} must not run as root." >&2
              exit 1
            fi
          done

      - name: Smoke test all services
        run: |
          set -euo pipefail

          smoke() {
            local label="$1" image="$2" port="$3" expect="$4"
            shift 4
            local name="quantumalpha-ci-${label}"
            local ok=true

            echo "=== ${label}: starting ${image}:ci on port ${port} ==="
            docker run -d --name "${name}" -p "${port}:${port}" "$@" "${image}:ci" > /dev/null

            local ready=false
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${port}/health" -o "response-${label}.txt"; then
                ready=true
                break
              fi
              sleep 2
            done

            if [ "${ready}" != true ]; then
              echo "${label}: did not become ready in time." >&2
              ok=false
            else
              cat "response-${label}.txt"
              echo
              if ! grep -qF "${expect}" <(tr -d ' \n' < "response-${label}.txt"); then
                echo "${label}: unexpected health response." >&2
                ok=false
              fi
            fi

            if [ "${ok}" != true ]; then
              docker logs "${name}" || true
            fi
            docker rm -f "${name}" > /dev/null || true
            [ "${ok}" = true ]
          }

          failed=0
          smoke api quantumalpha-api 8000 '"status":"ok"' || failed=1
          smoke data-service quantumalpha-service 8080 '"status":"ok"' \
            -e APP_MODULE=backend.data_service.app:app || failed=1
          smoke risk-service quantumalpha-service 8080 '"status":"ok"' \
            -e APP_MODULE=backend.risk_service.app:app || failed=1
          smoke execution-service quantumalpha-service 8080 '"status":"ok"' \
            -e APP_MODULE=backend.execution_service.app:app || failed=1
          smoke ai-engine quantumalpha-ai-engine 8080 '"status":"healthy"' || failed=1

          if [ "${failed}" -ne 0 ]; then
            echo "One or more services failed their smoke test." >&2
            exit 1
          fi
          echo "All services passed."

      - name: Clean up containers
        if: always()
        run: docker rm -f $(docker ps -aq --filter "name=quantumalpha-ci-") 2>/dev/null || true

  # ============================================================
  # Job 3 -- Web Frontend Test & Build
  # ============================================================
  web-frontend_test_and_build:
    name: Web-Frontend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: web-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run frontend tests
        run: CI=true npm test

      - name: Build web-frontend
        run: CI=false npm run build

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web-frontend/dist/
          retention-days: 7

  # ============================================================
  # Job 4 -- Mobile Frontend (Expo) Test & Build
  # ============================================================
  mobile_frontend:
    name: Mobile-Frontend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: mobile-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Mobile Tests
        run: npm run test:ci

      - name: Build Mobile Web Export
        run: CI=false npm run build:web

      - name: Upload Mobile Web Build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-web-dist
          path: mobile-frontend/dist/
          retention-days: 7
