service:
  name: risk-service
  version: 1.0.0
  description: "Risk management service for QuantumAlpha"
  host: 0.0.0.0
  port: 8080
  workers: 4
  timeout: 30

api:
  prefix: /api/v1
  rate_limit: 100
  cors_origins:
    - http://localhost:3000
    - https://staging.quantumalpha.ai
    - https://app.quantumalpha.ai

risk_limits:
  portfolio:
    max_drawdown: 0.15
    max_leverage: 1.5
    max_concentration: 0.20
    min_diversification: 10

  position:
    max_position_size: 0.20
    min_position_size: 0.01
    max_daily_loss: 0.05

  sector:
    max_sector_exposure: 0.30
    min_sectors: 3

  market:
    max_market_correlation: 0.80
    max_beta: 1.5

  volatility:
    max_portfolio_volatility: 0.20
    volatility_lookback: 252

  trading:
    max_daily_trades: 100
    max_daily_volume: 0.10
    max_slippage: 0.01
    min_liquidity: 1000000

position_sizing:
  methods:
    - name: equal_weight
      enabled: true
      description: "Equal weight allocation across all positions"
      params: {}

    - name: volatility_sizing
      enabled: true
      description: "Position sizing based on volatility"
      params:
        target_volatility: 0.15
        volatility_lookback: 63
        max_leverage: 1.5

    - name: kelly_criterion
      enabled: true
      description: "Kelly criterion for position sizing"
      params:
        fraction: 0.5
        win_rate_lookback: 100

    - name: risk_parity
      enabled: true
      description: "Risk parity allocation"
      params:
        risk_measure: volatility
        lookback: 252

    - name: fixed_notional
      enabled: true
      description: "Fixed notional amount per trade"
      params:
        base_amount: 10000
        scaling_factor: 1.0

  default_method: volatility_sizing

risk_calculations:
  metrics:
    - name: value_at_risk
      enabled: true
      description: "Value at Risk calculation"
      params:
        confidence_level: 0.95
        time_horizon: 1
        method: historical
        lookback: 252

    - name: expected_shortfall
      enabled: true
      description: "Expected Shortfall (Conditional VaR)"
      params:
        confidence_level: 0.95
        time_horizon: 1
        method: historical
        lookback: 252

    - name: sharpe_ratio
      enabled: true
      description: "Sharpe Ratio calculation"
      params:
        risk_free_rate: 0.02
        period: 252

    - name: sortino_ratio
      enabled: true
      description: "Sortino Ratio calculation"
      params:
        risk_free_rate: 0.02
        period: 252

    - name: maximum_drawdown
      enabled: true
      description: "Maximum Drawdown calculation"
      params:
        lookback: 252

    - name: beta
      enabled: true
      description: "Portfolio Beta calculation"
      params:
        market_index: "SPY"
        lookback: 252

    - name: correlation_matrix
      enabled: true
      description: "Correlation matrix calculation"
      params:
        lookback: 252
        min_periods: 100

  update_frequency: 3600

stress_testing:
  scenarios:
    - name: market_crash
      enabled: true
      description: "Market crash scenario"
      params:
        market_return: -0.20
        volatility_increase: 2.0
        correlation_increase: 0.3
        liquidity_decrease: 0.5

    - name: sector_rotation
      enabled: true
      description: "Sector rotation scenario"
      params:
        tech_return: -0.15
        energy_return: 0.10
        financial_return: 0.05
        healthcare_return: -0.05
        consumer_return: -0.10

    - name: interest_rate_hike
      enabled: true
      description: "Interest rate hike scenario"
      params:
        rate_increase: 0.01
        bond_return: -0.05
        financial_return: 0.03
        tech_return: -0.08

    - name: liquidity_crisis
      enabled: true
      description: "Liquidity crisis scenario"
      params:
        spread_increase: 0.02
        volume_decrease: 0.7
        volatility_increase: 3.0

    - name: historical_events
      enabled: true
      description: "Historical market events"
      events:
        - name: covid_crash_2020
          start_date: "2020-02-19"
          end_date: "2020-03-23"
        - name: financial_crisis_2008
          start_date: "2008-09-01"
          end_date: "2009-03-01"
        - name: dotcom_bubble_2000
          start_date: "2000-03-01"
          end_date: "2002-10-01"

  frequency: daily
  report_format: pdf

risk_alerts:
  enabled: true
  channels:
    - email
    - slack
    - in_app
  thresholds:
    portfolio_drawdown: 0.10
    position_loss: 0.07
    var_breach: 0.95
    leverage_high: 1.4
    concentration_high: 0.18
    liquidity_low: 0.7

  cooldown: 3600

kill_switch:
  enabled: true
  triggers:
    - metric: portfolio_drawdown
      threshold: 0.15
      time_window: 1440
    - metric: var_breach
      threshold: 0.99
      time_window: 1440
    - metric: leverage
      threshold: 1.5
      time_window: 60

  actions:
    - close_all_positions
    - notify_admin
    - log_event

  override:
    enabled: true
    authorized_roles:
      - risk_manager
      - portfolio_manager
    expiry: 3600

monitoring:
  metrics:
    enabled: true
    endpoint: /metrics
  health:
    enabled: true
    endpoint: /health
  logging:
    level: INFO
    format: json
    output: stdout
