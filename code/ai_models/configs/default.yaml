service:
  port: 8080
  workers: 2
registry:
  model_dir: models
  rl_model_dir: models/rl
data:
  service_url: http://data-service:8081
  request_timeout: 30
  retries: 2
  cache_ttl: 60
training:
  sequence_length: 30
  horizon: 5
  test_size: 0.2
  val_size: 0.1
  max_epochs: 500
monitoring:
  stale_days: 30
  psi_moderate: 0.1
  psi_significant: 0.25
